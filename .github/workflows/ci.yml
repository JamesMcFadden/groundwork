name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose, so pgvector is present.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundwork -d groundwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # These have no defaults in code; the application refuses to start without them.
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: ci-secret

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # MinIO needs a server argument, which service containers cannot supply, so it
      # runs as a plain container instead.
      - name: Start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=ci-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Create bucket
        run: |
          uv run python - <<'PY'
          import boto3
          from botocore.client import Config
          from botocore.exceptions import ClientError

          from app.config import get_settings

          settings = get_settings()
          client = boto3.client(
              "s3",
              endpoint_url=settings.s3_endpoint,
              aws_access_key_id=settings.s3_access_key,
              aws_secret_access_key=settings.s3_secret_key,
              region_name=settings.s3_region,
              config=Config(s3={"addressing_style": "path"}),
          )
          try:
              client.create_bucket(Bucket=settings.s3_bucket)
          except ClientError as exc:
              if exc.response["Error"]["Code"] not in {"BucketAlreadyOwnedByYou", "BucketAlreadyExists"}:
                  raise
          PY

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest -v
