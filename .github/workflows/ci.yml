name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Daily, so breakage from outside the repository is found within a day rather than
  # waiting for the next push: MinIO's Docker Hub images were deleted between two runs on
  # 2026-09-11 and surfaced only because a docs commit happened to follow. Off the top of
  # the hour, where scheduled runs bunch and are delayed. live-claude.yml is not scheduled:
  # it calls a paid API, and nothing outside the repository changes what it tests daily.
  schedule:
    - cron: "17 4 * * *"
  # So a nightly failure can be re-run once its outside cause is fixed, without a commit
  # made only to trigger CI.
  workflow_dispatch:

# A newer run of the same trigger makes an in-flight one irrelevant. The event is in the
# group because a scheduled run's ref is `refs/heads/main`, exactly a push to main's: in
# one group they would cancel each other, and the nightly run would stop finishing on the
# days the repository is busy, which are the days it is least redundant.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # The same pinned reference Compose runs, so tests see the same pgvector version.
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundwork -d groundwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      minio:
        # Built from source by .github/workflows/minio-image.yml; the same pinned
        # reference Compose runs.
        image: ghcr.io/jamesmcfadden/groundwork-minio:RELEASE.2025-10-15T17-29-55Z@sha256:98a0faf34af0449f1eaf322006864a44ae80f1663818ad8b2c95d20e5bf2fbdf
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: ci-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "wget -q --spider http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # These have no defaults in code; the application refuses to start without them.
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: ci-secret

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes no moving major tag, so the release is pinned exactly.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The embedding model's weights (~63 MB) come from the Hugging Face Hub, which
      # rate-limits unauthenticated requests from shared runner IPs. Keyed on the model
      # and the fastembed version, they download once rather than on every run.
      - name: Resolve embedding model cache key
        id: embedding-cache
        run: |
          uv run python - >> "$GITHUB_OUTPUT" <<'PY'
          import importlib.metadata

          from app.services.embeddings import EMBEDDING_MODEL

          version = importlib.metadata.version("fastembed")
          print(f"key=fastembed-{version}-{EMBEDDING_MODEL.replace('/', '-')}")
          PY

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fastembed
          key: ${{ steps.embedding-cache.outputs.key }}

      - name: Create bucket
        run: uv run python -m app.services.storage

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Test
        env:
          EMBEDDING_CACHE_DIR: ${{ runner.temp }}/fastembed
        run: uv run pytest -v

      # Retrieval figures for the golden set, with the answering path run by the stub, so
      # it needs no API key. The figures go to the job summary. A missed target is a result
      # to record rather than a failure: only a harness that cannot run fails this step.
      - name: Retrieval eval
        env:
          EMBEDDING_CACHE_DIR: ${{ runner.temp }}/fastembed
        run: uv run python -m eval --summary "$GITHUB_STEP_SUMMARY"
