name: minio-image

# Builds MinIO from its last community source release and publishes the image to the
# GitHub Container Registry. MinIO stopped publishing images, and the Docker Hub images
# this project pinned were deleted; the build itself is docker/minio/Dockerfile.
on:
  push:
    paths:
      - docker/minio/**
      - .github/workflows/minio-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two runs publishing the same tag at once would race.
concurrency:
  group: minio-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jamesmcfadden/groundwork-minio

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The Dockerfile is the one record of which MinIO release is built.
      - name: Read the MinIO release
        id: release
        run: |
          tag=$(sed -n 's/^ARG MINIO_TAG=//p' docker/minio/Dockerfile)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published release is never rebuilt. Consumers pin its digest, and a rebuild
      # would publish a different digest under the same tag. A new MinIO release gets a
      # tag of its own instead.
      - name: Check whether this release is already published
        id: existing
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "\`$IMAGE:$TAG\` is already published; nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.published == 'false'
        uses: docker/setup-buildx-action@v4

      # amd64 for CI runners and cloud nodes, arm64 for Apple silicon. The Dockerfile
      # cross-compiles, so neither platform is built under emulation.
      - name: Build and publish
        if: steps.existing.outputs.published == 'false'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/minio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}

      - name: Record the reference to pin
        if: steps.existing.outputs.published == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pin \`$IMAGE:$TAG@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
