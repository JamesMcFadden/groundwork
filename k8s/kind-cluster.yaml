# The local cluster M6 deploys to and measures on:
#   kind create cluster --config k8s/kind-cluster.yaml
#
# One node. Every kind node is a container on the same Docker VM, so more nodes would add
# scheduling boundaries and no capacity.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: groundwork
networking:
  # Named rather than left to kind's default: load results depend on how a Service
  # balances connections, and a default can change between kind releases.
  kubeProxyMode: iptables
nodes:
  - role: control-plane
    # Kubernetes 1.34, within the one minor version of skew the kubectl Docker Desktop ships
    # (1.34.1) supports; kind v0.33.0 defaults to 1.37. Pinned by digest, which kind's
    # release notes require to be sure of an image built for that release.
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
