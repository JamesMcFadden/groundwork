# The identity the API and the worker run as. Its annotation names the IAM role eksctl created
# for it, which may get and put objects under documents/ in the bucket, so the pods reach S3
# with no keys. The role's ARN replaces the placeholder from deploy.env.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: groundwork
  annotations:
    eks.amazonaws.com/role-arn: set-from-deploy-env
