name: groundwork

services:
  api:
    build:
      context: .
      target: api
    env_file: .env
    # Inside the compose network, services are reached by name rather than on
    # localhost. These override the host-oriented defaults in .env.
    environment:
      POSTGRES_HOST: postgres
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    # Both one-shots must finish first: the schema has to exist before the api opens a
    # pool against it, and the bucket before the first upload, which would otherwise fail
    # with NoSuchBucket while createbucket was still running.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health/live")
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully
    # No healthcheck: the worker serves no HTTP, so the api's probe does not
    # transfer here. On Kubernetes its liveness probe reads the age of a file the
    # worker touches instead; see docs/kubernetes.md.

  postgres:
    # pgvector's `pg16` tag moves with each release, and index-scan options depend on the
    # extension version. Pinned by version and digest, so a new release can never change
    # how search behaves.
    image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # Built from MinIO's last community source release by docker/minio/Dockerfile and
    # published by .github/workflows/minio-image.yml, since MinIO no longer publishes
    # images. Pinned by digest, so republishing a tag can never change what runs.
    image: ghcr.io/jamesmcfadden/groundwork-minio:RELEASE.2025-10-15T17-29-55Z@sha256:98a0faf34af0449f1eaf322006864a44ae80f1663818ad8b2c95d20e5bf2fbdf
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: applies the schema, then exits, so `docker compose up` is the whole setup
  # and a fresh clone needs no Python on the host. It runs the migrations from the api
  # image, which ships them and alembic.ini, so there is no second image and no second
  # copy of the connection settings. Run again on an up-to-date database it finds nothing
  # to do, which is what makes it safe on every `up` rather than only the first.
  migrate:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  # One-shot: creates the bucket on a fresh volume, then exits. Without this the
  # first upload fails with NoSuchBucket. It runs the application's own storage code from
  # the api image, so no separate client image is needed.
  createbucket:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      S3_ENDPOINT: http://minio:9000
    depends_on:
      minio:
        condition: service_healthy
    command: ["python", "-m", "app.services.storage"]

volumes:
  pgdata:
  miniodata:
